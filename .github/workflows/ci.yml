name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install shells and rendering tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y zsh fish ffmpeg python3 python3-pil util-linux rpm
          curl -fsSL https://github.com/asciinema/agg/releases/latest/download/agg-x86_64-unknown-linux-gnu -o /usr/local/bin/agg
          sudo chmod +x /usr/local/bin/agg

      - name: Run test suite
        run: |
          chmod +x bin/* scripts/* packaging/deb/* packaging/rpm/* tests/*
          make test

      - name: Verify package builds (.deb, .rpm, .tar.gz)
        run: |
          make packages
          ls -lh dist/
